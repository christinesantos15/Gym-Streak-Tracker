<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Gym Repetition & Streak Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

    <div class="container mx-auto p-6 max-w-5xl">
        <header class="flex justify-between items-center mb-10 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-400">⚡ Gym Repetition & Streak Tracker</h1>
                <p class="text-slate-400 text-sm mt-1">A real-time performance logging engine calculating dynamic daily engagement streaks.</p>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-gradient-to-br from-orange-500/20 to-amber-500/10 p-6 rounded-xl border border-orange-500/30 flex items-center justify-between shadow-lg">
                <div>
                    <h3 class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Current Training Streak</h3>
                    <p id="streakCount" class="text-5xl font-black text-orange-400 mt-1">0 Days</p>
                </div>
                <div class="text-4xl">🔥</div>
            </div>
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 flex items-center justify-between shadow-lg">
                <div>
                    <h3 class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Last Tracked Session</h3>
                    <p id="lastDate" class="text-xl font-mono text-slate-200 mt-2">None Recorded</p>
                </div>
                <div class="text-4xl">📅</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl h-fit">
                <h2 class="text-lg font-semibold mb-4 text-slate-200">Log Repetitions</h2>
                <form id="workoutForm" class="space-y-4">
                    <div>
                        <label class="block text-xs uppercase font-medium text-slate-400 mb-1">Exercise Name</label>
                        <input type="text" id="exercise" required placeholder="e.g., Push-ups, Squats" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white focus:outline-none focus:border-orange-500">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs uppercase font-medium text-slate-400 mb-1">Sets</label>
                            <input type="number" id="sets" required min="1" placeholder="4" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white focus:outline-none focus:border-orange-500">
                        </div>
                        <div>
                            <label class="block text-xs uppercase font-medium text-slate-400 mb-1">Reps per Set</label>
                            <input type="number" id="reps" required min="1" placeholder="12" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white focus:outline-none focus:border-orange-500">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 text-slate-950 font-bold py-3 rounded-lg shadow-md hover:opacity-90 transition">Commit Workout Log</button>
                </form>
            </div>

            <div class="lg:col-span-2 bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4">
                    <h2 class="text-lg font-semibold text-slate-200">Workout History Logs</h2>
                    
                    <div class="flex items-center gap-2 w-full sm:w-auto">
                        <label class="text-xs font-mono text-slate-400 uppercase">Filter Date:</label>
                        <input type="date" id="dateFilter" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm text-white focus:outline-none focus:border-orange-500">
                        <button onclick="clearDateFilter()" class="text-xs text-slate-400 hover:text-white bg-slate-700 px-2 py-1 rounded transition">Clear</button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-700 text-slate-400 text-xs uppercase font-mono">
                                <th class="pb-3">Exercise</th>
                                <th class="pb-3">Volume</th>
                                <th class="pb-3 text-right">Timestamp</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody" class="divide-y divide-slate-800 text-sm">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Automatically detects if the app is on your laptop or live on your AWS EC2 Public IP
const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
    ? 'http://localhost:8085'
    : `http://${window.location.hostname}:8085`;

        // 🟢 PASTE THE NEW CODE RIGHT HERE:
        let allLogs = []; 

        async function updateDashboardData() {
            try {
                const streakRes = await fetch(`${API_URL}/streak`);
                const streakData = await streakRes.json();
                document.getElementById('streakCount').innerText = `${streakData.current_streak} Day${streakData.current_streak === 1 ? '' : 's'}`;
                document.getElementById('lastDate').innerText = streakData.last_workout_date ? streakData.last_workout_date : 'None Recorded';

                const logsRes = await fetch(`${API_URL}/workouts`);
                allLogs = await logsRes.json();
                
                renderLogs();
            } catch (err) {
                console.error("Connection down: ", err);
            }
        }

        function renderLogs() {
            const tbody = document.getElementById('historyTableBody');
            const selectedDate = document.getElementById('dateFilter').value; 
            tbody.innerHTML = '';

            const filteredLogs = allLogs.filter(item => {
                if (!selectedDate) return true;
                const logDateISO = new Date(item.logged_date).toISOString().split('T')[0];
                return logDateISO === selectedDate;
            });

            if (filteredLogs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="py-8 text-center text-slate-500 font-mono">No logged workouts found for this selection.</td></tr>`;
                return;
            }

            filteredLogs.forEach(item => {
                const timeString = new Date(item.logged_date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const dateString = new Date(item.logged_date).toLocaleDateString([], {month: 'short', day: 'numeric'});
                
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-700/20 transition group">
                        <td class="py-4 font-semibold text-white">${item.exercise_name}</td>
                        <td class="py-4 font-mono text-amber-400">${item.sets} sets × ${item.repetitions} reps</td>
                        <td class="py-4 text-right space-x-3">
                            <span class="text-slate-400 text-xs font-mono">${dateString} @ ${timeString}</span>
                            <button onclick="deleteWorkout(${item.id})" class="text-rose-500 hover:text-rose-400 font-medium text-xs border border-rose-500/20 hover:border-rose-500/50 bg-rose-500/10 px-2 py-1 rounded transition">
                                Delete
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        document.getElementById('dateFilter').addEventListener('input', renderLogs);

        function clearDateFilter() {
            document.getElementById('dateFilter').value = '';
            renderLogs();
        }

        async function deleteWorkout(id) {
            if (confirm("Are you sure you want to remove this log entry?")) {
                await fetch(`${API_URL}/workouts/${id}`, { method: 'DELETE' });
                updateDashboardData();
            }
        }
        // 🛑 NEW CODE SECTION ENDS HERE

        // Keep your existing form submit listener below it:
        document.getElementById('workoutForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                exercise_name: document.getElementById('exercise').value,
                sets: parseInt(document.getElementById('sets').value),
                repetitions: parseInt(document.getElementById('reps').value)
            };

            await fetch(`${API_URL}/workouts`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            document.getElementById('workoutForm').reset();
            updateDashboardData();
        });

        window.addEventListener('DOMContentLoaded', updateDashboardData);
    </script>
</body>
</html>
