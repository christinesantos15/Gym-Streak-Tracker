name: CI/CD Deployment to AWS EC2

on:
  push:
    branches:
      - main  # Triggers the pipeline every time you push code to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code from GitHub
        uses: actions/checkout@v3

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}          # Your EC2 Public IP address
          username: ${{ secrets.EC2_USER }}  # Usually 'ubuntu' or 'ec2-user'
          key: ${{ secrets.EC2_SSH_KEY }}       # Your private .pem key file content
          port: 22
          script: |
            # 1. Navigate to your project directory on the EC2 instance
            cd ~/Gym-Streak-Tracker || git clone https://github.com/${{ github.repository }}.git ~/Gym-Streak-Tracker && cd ~/Gym-Streak-Tracker
            
            # 2. Pull the absolute latest code changes from your repository
            git pull origin main
            
            # 3. Shut down any old running containers to free up the ports
            docker compose down
            
            # 4. Rebuild and launch the brand new container ecosystem in background mode
            docker compose up --build -d